name: Publish to PyPI
on:
  push:
    tags:
      - 'v*'
jobs:
  build-n-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Build
      run: python -m pip install build && python -m build
    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
      
